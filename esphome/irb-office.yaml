substitutions:
  device_name: irb-office
  friendly_name: Office IR Blaster

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp_wroom_02
  board_flash_mode: dout

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret irb_office_api_key

ota:
  - platform: esphome
    id: irb_office_ota
    password: !secret irb_office_ota_passwd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min

  ap:
    ssid: Office IR Fallback
    password: !secret esphome_fallback_ap_password

captive_portal:

remote_transmitter:
  id: ir_transmitter
  pin: GPIO14
  carrier_duty_percent: 50%

infrared:
  - platform: ir_rf_proxy
    name: IR Transmitter
    id: infrared_transmitter
    remote_transmitter_id: ir_transmitter

button:
  # Diagnostic only.
  # Produces a long 38 kHz IR burst so the emitters
  # are easier to see through a phone camera.
  - platform: template
    name: IR Emission Test
    entity_category: diagnostic
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code:
            - 100000
            - -20000
            - 100000
            - -20000
            - 100000

  - platform: restart
    name: Restart
    entity_category: diagnostic