substitutions:
  device_name: irb-office
  friendly_name: Office IR Blaster

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp8266:
  board: esp_wroom_02
  board_flash_mode: dout

logger:
  baud_rate: 0
  level: INFO

api:
  encryption:
    key: !secret irb_office_api_key

ota:
  - platform: esphome
    id: irb_office_ota
    password: !secret irb_office_ota_passwd

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 15min

  ap:
    ssid: Office IR Fallback
    password: !secret esphome_fallback_ap_password

captive_portal:

remote_transmitter:
  id: ir_transmitter
  pin:
    number: GPIO14
    mode:
      output: true
  carrier_duty_percent: 50%

infrared:
  - platform: ir_rf_proxy
    name: IR Transmitter
    id: infrared_transmitter
    remote_transmitter_id: ir_transmitter
    
button:
  # Simple hardware/emission test.
  # Point a phone camera at the Q1 and press this.
  - platform: template
    name: "IR Emission Test"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code:
            - 100000
            - -20000
            - 100000
            - -20000
            - 100000

  # Known BP01 raw OFF command.
  - platform: template
    name: "Dyson Raw Off Test"
    on_press:
      - remote_transmitter.transmit_raw:
          carrier_frequency: 38kHz
          code:
            - 2230
            - -730
            - 750
            - -755
            - 740
            - -735
            - 775
            - -705
            - 740
            - -1465
            - 745
            - -710
            - 770
            - -710
            - 740
            - -735
            - 740
            - -1465
            - 775
            - -1440
            - 745
            - -710
            - 740
            - -735
            - 775
            - -710
            - 740
            - -735
            - 775
            - -1440
            - 745
            - -710
            - 740
            - -735
            - 805
            - -675
            - 715
            - -790
            - 740
            - -1455
            - 745
            - -710
            - 775
            - -1500
            - 745
            - -710

  - platform: restart
    name: Restart
    entity_category: diagnostic